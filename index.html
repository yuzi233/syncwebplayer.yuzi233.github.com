<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPS - 同步影厅 (NAS/VPS 部署版)</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #eee; margin: 0; padding: 15px; }
    
    .layout { display: grid; grid-template-columns: 1fr 320px; gap: 15px; max-width: 1200px; margin: 0 auto; }
    @media (max-width: 850px) { .layout { grid-template-columns: 1fr; } }

    .panel { background: #1e1e1e; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
    .inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
    input, button, select { padding: 8px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 13px; }
    button { background: #0070f3; border: none; cursor: pointer; font-weight: bold; color: #fff; }
    button:hover { background: #0051a8; }
    
    .stage { position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; }
    video { width: 100%; height: 100%; }
    .danmaku-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
    .danmaku { position: absolute; white-space: nowrap; font-weight: bold; font-size: 18px; color: #fff; text-shadow: 1px 1px 2px #000; animation: moveDanmaku 6s linear forwards; }
    @keyframes moveDanmaku {
      from { transform: translateX(100%); }
      to { transform: translateX(-100%); }
    }

    .chat-panel { background: #1e1e1e; border-radius: 8px; display: flex; flex-direction: column; height: 100%; max-height: 580px; }
    .chat-box { flex: 1; padding: 10px; overflow-y: auto; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
    .chat-item { background: #2a2a2a; padding: 6px 10px; border-radius: 4px; word-break: break-all; }
    .chat-user { color: #0070f3; font-weight: bold; margin-right: 5px; }
    .chat-input { display: flex; padding: 10px; gap: 5px; border-top: 1px solid #333; }

    .tag { display: inline-block; padding: 2px 6px; font-size: 10px; border-radius: 3px; margin-left: 5px; }
    .tag-host { background: #e53e3e; }
    .tag-local { background: #dd6b20; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #aaa; margin-right: 5px; }
    .status-online { background: #48bb78; }
  </style>
</head>
<body>

<div class="layout">
  <div>
    <!-- 服务器与连接配置 -->
    <div class="panel">
      <div style="font-size: 12px; color: #888; margin-bottom: 6px;">服务器配置</div>
      <div class="inputs" style="grid-template-columns: 1fr auto;">
        <input type="text" id="serverAddress" placeholder="如 wss://sync.yourdomain.com 或 ws://192.168.1.100:3000">
        <button onclick="saveServerAddress()">保存配置</button>
      </div>
    </div>

    <!-- 房间配置 -->
    <div class="panel">
      <div class="inputs">
        <input type="text" id="room" value="101" placeholder="房间号">
        <input type="password" id="pass" placeholder="密码 (选填)">
        <input type="text" id="user" value="UserA" placeholder="昵称">
        <button onclick="connectRoom()">进入房间</button>
      </div>

      <div class="inputs" style="margin-top: 8px;">
        <select id="sourceType" onchange="toggleSourceType()">
          <option value="m3u8">M3U8 网络源 (同步)</option>
          <option value="local">本地文件 (仅本地，不同步)</option>
        </select>
        
        <input type="text" id="m3u8Url" placeholder="M3U8 播放链接..." style="grid-column: span 2;">
        <input type="file" id="localFile" accept="video/*" style="display:none;" onchange="loadLocalFile(this)">
        <button id="btnUpdateUrl" onclick="submitUrlChange()">应用/广播新源</button>
      </div>
    </div>

    <div class="stage">
      <video id="video" controls></video>
      <div class="danmaku-layer" id="danmakuLayer"></div>
    </div>
  </div>

  <div class="chat-panel">
    <div style="padding: 10px; border-bottom: 1px solid #333; font-weight: bold; display: flex; justify-content: space-between; align-items: center;">
      <div>
        <span id="statusDot" class="status-dot"></span>
        <span>弹幕聊天室</span>
      </div>
      <span id="roleBadge"></span>
    </div>
    <div class="chat-box" id="chatBox"></div>
    <div class="chat-input">
      <input type="text" id="chatMsg" placeholder="发弹幕..." style="flex:1;" onkeydown="if(event.key==='Enter') sendChat()">
      <button onclick="sendChat()">发送</button>
    </div>
  </div>
</div>

<script>
  let hls, ws;
  let isHost = false;
  let isLocalMode = false;
  let isRemoteAction = false;
  let currentLoadedUrl = '';

  const video = document.getElementById('video');

  // 初始化服务器地址策略：优先使用 localStorage，其次获取当前页面 Host
  window.onload = () => {
    const savedServer = localStorage.getItem('sps_server_address');
    if (savedServer) {
      document.getElementById('serverAddress').value = savedServer;
    } else {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      document.getElementById('serverAddress').value = `${protocol}//${window.location.host}`;
    }
  };

  function saveServerAddress() {
    const addr = document.getElementById('serverAddress').value.trim();
    if (addr) {
      localStorage.setItem('sps_server_address', addr);
      alert('服务器地址已保存！');
    }
  }

  function getWsAddress() {
    let addr = document.getElementById('serverAddress').value.trim();
    if (!addr.startsWith('ws://') && !addr.startsWith('wss://')) {
      const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
      addr = protocol + addr;
    }
    return addr;
  }

  function toggleSourceType() {
    const type = document.getElementById('sourceType').value;
    const urlInput = document.getElementById('m3u8Url');
    const fileInput = document.getElementById('localFile');

    if (type === 'local') {
      isLocalMode = true;
      urlInput.style.display = 'none';
      fileInput.style.display = 'block';
      appendSystemChat('已切至本地文件模式：进度不同步，聊天保持连通。');
      document.getElementById('roleBadge').innerHTML = '<span class="tag tag-local">本地单播</span>';
    } else {
      isLocalMode = false;
      urlInput.style.display = 'block';
      fileInput.style.display = 'none';
      appendSystemChat('已切至 M3U8 同步模式。');
    }
  }

  function loadLocalFile(input) {
    const file = input.files[0];
    if (file) {
      if (hls) hls.destroy();
      currentLoadedUrl = '';
      video.src = URL.createObjectURL(file);
      appendSystemChat(`本地文件: ${file.name}`);
    }
  }

  function connectRoom() {
    const wsUrl = getWsAddress();
    const room = document.getElementById('room').value;
    const pass = document.getElementById('pass').value;
    const user = document.getElementById('user').value;

    if (ws) ws.close();
    
    try {
      ws = new WebSocket(wsUrl);
    } catch (e) {
      alert('WebSocket 地址配置格式错误！');
      return;
    }

    ws.onopen = () => {
      document.getElementById('statusDot').classList.add('status-online');
      ws.send(JSON.stringify({
        type: 'join',
        room, pass, user,
        m3u8Url: document.getElementById('m3u8Url').value,
        duration: video.duration || 0
      }));
    };

    ws.onclose = () => {
      document.getElementById('statusDot').classList.remove('status-online');
    };

    ws.onerror = () => {
      appendSystemChat('连接服务器失败，请检查服务器地址是否正确及可访问。');
    };

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);

      if (data.type === 'joined') {
        isHost = data.isHost;
        updateRoleBadge();
        
        if (data.m3u8Url && !isLocalMode) {
          document.getElementById('m3u8Url').value = data.m3u8Url;
          loadHls(data.m3u8Url);
        }
        syncVideoState(data.state.time, data.state.paused);
        startHeartbeat();
      }

      if (data.type === 'host_transfer') {
        isHost = true;
        updateRoleBadge();
        appendSystemChat('原房主离开，你已自动成为房主！');
      }

      if (data.type === 'url_changed' && !isLocalMode) {
        appendSystemChat(`${data.by} 更换了播放源`);
        document.getElementById('m3u8Url').value = data.url;
        loadHls(data.url);
      }

      if (data.type === 'sync' && !isLocalMode) {
        const diff = Math.abs(video.currentTime - data.time);
        if (diff > 1.8) syncVideoState(data.time, data.paused);
      }

      if (data.type === 'action' && !isLocalMode) {
        if (data.action === 'play') syncVideoState(data.time, false);
        if (data.action === 'pause') syncVideoState(data.time, true);
        if (data.action === 'seek') syncVideoState(data.time, video.paused);
      }

      if (data.type === 'chat') {
        appendChat(data.user, data.text);
        renderDanmaku(data.text);
      }

      if (data.type === 'error') alert(data.message);
    };
  }

  function submitUrlChange() {
    const url = document.getElementById('m3u8Url').value;
    if (isLocalMode || !url) return;

    loadHls(url);

    const handleMetadata = () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'change_url',
          url: url,
          duration: video.duration
        }));
      }
      video.removeEventListener('loadedmetadata', handleMetadata);
    };

    video.addEventListener('loadedmetadata', handleMetadata);
  }

  function loadHls(url) {
    if (!url || url === currentLoadedUrl) return;
    currentLoadedUrl = url;

    if (Hls.isSupported()) {
      if (hls) hls.destroy();
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
    }
  }

  function syncVideoState(time, paused) {
    if (isLocalMode) return;
    isRemoteAction = true;
    if (Math.abs(video.currentTime - time) > 0.5) video.currentTime = time;
    if (paused && !video.paused) video.pause();
    if (!paused && video.paused) video.play().catch(()=>{});
    setTimeout(() => isRemoteAction = false, 300);
  }

  function startHeartbeat() {
    setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN && !isLocalMode) {
        ws.send(JSON.stringify({ type: 'sync', time: video.currentTime, clientTime: Date.now() }));
      }
    }, 3000);
  }

  ['play', 'pause', 'seeking'].forEach(evt => {
    video.addEventListener(evt, () => {
      if (isRemoteAction || isLocalMode || !ws || ws.readyState !== WebSocket.OPEN) return;
      const action = evt === 'seeking' ? 'seek' : evt;
      ws.send(JSON.stringify({ type: 'action', action, time: video.currentTime }));
    });
  });

  function sendChat() {
    const input = document.getElementById('chatMsg');
    const text = input.value.trim();
    if (!text || !ws) return;
    ws.send(JSON.stringify({ type: 'chat', text }));
    input.value = '';
  }

  function appendChat(user, text) {
    const box = document.getElementById('chatBox');
    const div = document.createElement('div');
    div.className = 'chat-item';
    div.innerHTML = `<span class="chat-user">${user}:</span> ${text}`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function appendSystemChat(text) {
    appendChat('系统', text);
  }

  function renderDanmaku(text) {
    const layer = document.getElementById('danmakuLayer');
    const el = document.createElement('div');
    el.className = 'danmaku';
    el.innerText = text;
    const top = Math.floor(Math.random() * 70) + 10;
    el.style.top = top + '%';
    layer.appendChild(el);
    setTimeout(() => el.remove(), 6000);
  }

  function updateRoleBadge() {
    const badge = document.getElementById('roleBadge');
    badge.innerHTML = isHost ? '<span class="tag tag-host">房主</span>' : '<span class="tag">成员</span>';
  }
</script>

</body>
</html>
