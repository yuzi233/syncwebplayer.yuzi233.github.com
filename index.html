<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Syncplay Web</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: #ddd;
    font-family: system-ui, sans-serif;
}

.app {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

h1 {
    margin-top: 0;
}

.panel {
    background: #1b1b1b;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 15px;
}

.row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
}

input {
    background: #222;
    border: 1px solid #444;
    color: white;
    padding: 9px;
    border-radius: 5px;
}

input[type="text"],
input[type="password"] {
    flex: 1;
    min-width: 160px;
}

button {
    background: #333;
    border: 1px solid #555;
    color: white;
    padding: 9px 15px;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #444;
}

button:disabled {
    opacity: 0.5;
    cursor: default;
}

video {
    display: block;
    width: 100%;
    max-height: 70vh;
    background: black;
    border-radius: 6px;
}

.status {
    font-family: monospace;
    color: #aaa;
}

.columns {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 15px;
}

.users {
    white-space: pre-wrap;
    font-family: monospace;
}

.chat {
    height: 180px;
    overflow-y: auto;
    background: #111;
    padding: 10px;
    font-family: monospace;
    border-radius: 5px;
}

.chat-input {
    display: flex;
    margin-top: 8px;
}

.chat-input input {
    flex: 1;
}

.log {
    height: 120px;
    overflow-y: auto;
    background: #111;
    padding: 10px;
    font-family: monospace;
    font-size: 12px;
    white-space: pre-wrap;
}
</style>

</head>

<body>

<div class="app">

<h1>Syncplay Web</h1>

<div class="panel">

<div class="row">
    <input id="server"
           type="text"
           value="wss://your-worker.example.workers.dev"
           placeholder="WSS / WS 地址">
</div>

<div class="row">
    <input id="room"
           type="text"
           placeholder="房间名">

```
<input id="password"
       type="password"
       placeholder="房间密码">

<input id="username"
       type="text"
       placeholder="用户名">
```

</div>

<div class="row">
    <button id="connectBtn">连接</button>
    <button id="disconnectBtn" disabled>断开</button>

```
<label>
    <input id="fileInput" type="file" accept="video/*">
</label>
```

</div>

<div class="status" id="status">
    未连接
</div>

</div>

<div class="columns">

<div>

<div class="panel">
    <video id="video" controls></video>
</div>

<div class="panel">

<h3>聊天</h3>

<div id="chat" class="chat"></div>

<div class="chat-input">
    <input id="chatInput" type="text" placeholder="输入消息">
    <button id="chatSend">发送</button>
</div>

</div>

<div class="panel">

<h3>Debug</h3>

<div id="log" class="log"></div>

</div>

</div>

<div>

<div class="panel">

<h3>房间用户</h3>

<div id="users" class="users">
暂无
</div>

</div>

</div>

</div>

</div>

<script>

"use strict";


/* ============================================================
 * 基础状态
 * ============================================================
 */

const state = {

    ws: null,

    connected: false,
    logged: false,

    username: "",
    room: "",

    serverVersion: null,

    currentFile: null,

    users: {},

    ignoreLocalEvents: false,

    clientIgnore: 0,
    serverIgnore: 0,

    lastServerLatencyCalculation: null,

    pingTimer: null,

    reconnectTimer: null
};


const video = document.getElementById("video");
const serverInput = document.getElementById("server");
const roomInput = document.getElementById("room");
const passwordInput = document.getElementById("password");
const usernameInput = document.getElementById("username");

const connectBtn = document.getElementById("connectBtn");
const disconnectBtn = document.getElementById("disconnectBtn");

const fileInput = document.getElementById("fileInput");

const statusElement = document.getElementById("status");
const usersElement = document.getElementById("users");
const chatElement = document.getElementById("chat");
const chatInput = document.getElementById("chatInput");
const chatSend = document.getElementById("chatSend");
const logElement = document.getElementById("log");


/* ============================================================
 * 工具
 * ============================================================
 */

function randomUsername() {

    const chars =
        "abcdefghijklmnopqrstuvwxyz0123456789";

    let result = "Web-";

    for (let i = 0; i < 6; i++) {
        result += chars[
            Math.floor(Math.random() * chars.length)
        ];
    }

    return result;
}


function log(message) {

    const time = new Date().toLocaleTimeString();

    logElement.textContent +=
        `[${time}] ${message}\n`;

    logElement.scrollTop =
        logElement.scrollHeight;
}


function setStatus(message) {

    statusElement.textContent = message;

    log(message);
}


function send(message) {

    if (!state.ws ||
        state.ws.readyState !== WebSocket.OPEN) {

        return false;
    }

    const line =
        JSON.stringify(message) + "\n";

    state.ws.send(line);

    log(">> " + JSON.stringify(message));

    return true;
}


/* ============================================================
 * 初始化用户名
 * ============================================================
 */

if (!usernameInput.value) {

    usernameInput.value =
        randomUsername();
}


/* ============================================================
 * WebSocket
 * ============================================================
 */

function connect() {

    if (state.ws) {
        try {
            state.ws.close();
        } catch {}
    }

    const url =
        serverInput.value.trim();

    const room =
        roomInput.value.trim();

    if (!url) {
        alert("请输入 WebSocket 地址");
        return;
    }

    if (!room) {
        alert("请输入房间名");
        return;
    }

    state.username =
        usernameInput.value.trim() ||
        randomUsername();

    usernameInput.value =
        state.username;

    state.room = room;

    setStatus("正在连接 " + url);

    let ws;

    try {
        ws = new WebSocket(url);

        /*
         * 非常重要：
         *
         * Worker TCP -> WS 使用原始 bytes。
         * 浏览器因此收到 ArrayBuffer。
         */
        ws.binaryType = "arraybuffer";

    } catch (e) {

        setStatus("WebSocket 创建失败: " + e);
        return;
    }

    state.ws = ws;

    connectBtn.disabled = true;
    disconnectBtn.disabled = false;


    ws.addEventListener("open", () => {

        state.connected = true;

        setStatus("WebSocket 已连接，发送 Hello");

        sendHello();

        startPing();

    });


    ws.addEventListener("message", event => {

        handleIncomingData(event.data);

    });


    ws.addEventListener("error", event => {

        console.error(event);

        setStatus("WebSocket 错误");

    });


    ws.addEventListener("close", event => {

        state.connected = false;
        state.logged = false;

        stopPing();

        connectBtn.disabled = false;
        disconnectBtn.disabled = true;

        setStatus(
            `连接关闭 code=${event.code} reason=${event.reason || ""}`
        );

    });
}


function disconnect() {

    stopPing();

    if (state.ws) {

        try {
            state.ws.close();
        } catch {}

    }

    state.ws = null;
    state.connected = false;
    state.logged = false;

    connectBtn.disabled = false;
    disconnectBtn.disabled = true;

    setStatus("已断开");
}


/* ============================================================
 * TCP-like line parser
 *
 * Syncplay:
 *
 * {"Hello": ...}\n
 * {"State": ...}\n
 *
 * WebSocket 自己有 message boundary，
 * 但 Worker 转发的是 TCP chunks，
 * 所以仍然必须自己处理换行。
 * ============================================================
 */

const decoder =
    new TextDecoder("utf-8");

let receiveBuffer = "";


function handleIncomingData(data) {

    let text;

    if (typeof data === "string") {

        text = data;

    } else if (data instanceof ArrayBuffer) {

        text = decoder.decode(
            new Uint8Array(data),
            { stream: true }
        );

    } else if (data instanceof Blob) {

        data.arrayBuffer().then(buffer => {
            handleIncomingData(buffer);
        });

        return;

    } else {

        console.warn(
            "Unknown websocket data type",
            data
        );

        return;
    }


    receiveBuffer += text;

    while (true) {

        const index =
            receiveBuffer.indexOf("\n");

        if (index < 0)
            break;

        const line =
            receiveBuffer.slice(0, index).trim();

        receiveBuffer =
            receiveBuffer.slice(index + 1);

        if (!line)
            continue;

        try {

            const message =
                JSON.parse(line);

            log("<< " + line);

            handleSyncplayMessage(message);

        } catch (e) {

            console.error(
                "Invalid Syncplay JSON:",
                line,
                e
            );

        }
    }
}


/* ============================================================
 * Syncplay Hello
 * ============================================================
 */

function sendHello() {

    const password =
        passwordInput.value;

    const hello = {

        username:
            state.username,

        room: {
            name:
                state.room
        },

        /*
         * 1.2.255 是 Syncplay 官方协议中
         * 用于兼容新服务器的客户端协议版本。
         */
        version: "1.2.255",

        /*
         * realversion 可以给一个自己的 web client
         * 版本。
         */
        realversion: "web-0.1.0",

        /*
         * 最小 features。
         *
         * 不宣称支持 playlist/controller 等高级功能。
         */
        features: {}

    };

    if (password) {
        hello.password = password;
    }

    send({
        Hello: hello
    });
}


/* ============================================================
 * 收到 Syncplay 消息
 * ============================================================
 */

function handleSyncplayMessage(message) {

    if (message.Hello !== undefined) {

        handleHello(message.Hello);

    } else if (message.Error !== undefined) {

        handleError(message.Error);

    } else if (message.State !== undefined) {

        handleState(message.State);

    } else if (message.List !== undefined) {

        handleList(message.List);

    } else if (message.Set !== undefined) {

        handleSet(message.Set);

    } else if (message.Chat !== undefined) {

        handleChat(message.Chat);

    } else {

        log(
            "未知 Syncplay 消息: " +
            JSON.stringify(message)
        );
    }
}


/* ============================================================
 * Server Hello
 * ============================================================
 */

function handleHello(hello) {

    state.logged = true;

    state.serverVersion =
        hello.version || null;

    if (hello.username) {

        /*
         * 服务器可能因为用户名重复而修改用户名。
         */
        state.username =
            hello.username;

        usernameInput.value =
            hello.username;
    }

    if (hello.room &&
        hello.room.name) {

        state.room =
            hello.room.name;

        roomInput.value =
            hello.room.name;
    }

    setStatus(
        `已进入房间：${state.room}`
    );

    if (hello.motd) {

        addChatMessage(
            "Server",
            hello.motd
        );
    }

    /*
     * 官方客户端收到 Hello 后会发送自己的文件信息。
     * 如果目前没有文件，则发送空文件。
     */
    sendCurrentFile();

    /*
     * 请求用户列表。
     */
    send({
        List: null
    });
}


/* ============================================================
 * Error
 * ============================================================
 */

function handleError(error) {

    const message =
        error?.message || "Unknown error";

    setStatus(
        "Syncplay 错误：" + message
    );

    addChatMessage(
        "Server",
        message
    );
}


/* ============================================================
 * File
 * ============================================================
 */

fileInput.addEventListener(
    "change",
    () => {

        const file =
            fileInput.files[0];

        if (!file)
            return;

        const url =
            URL.createObjectURL(file);

        state.currentFile = file;

        video.src = url;
        video.load();

        /*
         * metadata 加载之后才能知道 duration。
         */
        video.addEventListener(
            "loadedmetadata",
            () => {

                sendCurrentFile();

            },
            { once: true }
        );
    }
);


function sendCurrentFile() {

    if (!state.logged)
        return;

    const file =
        state.currentFile;

    if (!file) {

        send({
            Set: {
                file: {}
            }
        });

        send({
            List: null
        });

        return;
    }

    const fileInfo = {

        name:
            file.name,

        size:
            file.size,

        duration:
            Number.isFinite(video.duration)
                ? video.duration
                : 0
    };


    send({
        Set: {
            file: fileInfo
        }
    });

    send({
        List: null
    });
}


/* ============================================================
 * 用户列表
 * ============================================================
 */

function handleList(list) {

    state.users = {};

    for (const roomName of Object.keys(list)) {

        const room =
            list[roomName];

        for (const username of Object.keys(room)) {

            state.users[username] = {

                room:
                    roomName,

                ...room[username]

            };
        }
    }

    renderUsers();
}


function renderUsers() {

    const names =
        Object.keys(state.users);

    if (!names.length) {

        usersElement.textContent =
            "暂无";

        return;
    }

    let output = "";

    for (const name of names) {

        const user =
            state.users[name];

        const file =
            user.file || {};

        output +=
            `${name}\n`;

        if (file.name) {

            output +=
                `  ${file.name}\n`;

        } else {

            output +=
                `  [没有文件]\n`;
        }

        output += "\n";
    }

    usersElement.textContent =
        output;
}


/* ============================================================
 * Set
 * ============================================================
 */

function handleSet(settings) {

    /*
     * 用户加入 / 离开
     */
    if (settings.user) {

        for (const username of Object.keys(
            settings.user
        )) {

            const user =
                settings.user[username];

            if (user.event?.left) {

                delete state.users[username];

            } else {

                const old =
                    state.users[username] || {};

                state.users[username] = {
                    ...old,
                    ...user
                };
            }
        }

        renderUsers();
    }


    /*
     * 房间发生变化
     */
    if (settings.room) {

        if (settings.room.name) {

            state.room =
                settings.room.name;

            roomInput.value =
                state.room;
        }
    }
}


/* ============================================================
 * Chat
 * ============================================================
 */

function handleChat(message) {

    addChatMessage(
        message.username || "?",
        message.message || ""
    );
}


function addChatMessage(username, message) {

    const div =
        document.createElement("div");

    div.textContent =
        `<${username}> ${message}`;

    chatElement.appendChild(div);

    chatElement.scrollTop =
        chatElement.scrollHeight;
}


function sendChat() {

    const message =
        chatInput.value.trim();

    if (!message)
        return;

    if (!state.logged)
        return;

    send({
        Chat: {
            message
        }
    });

    chatInput.value = "";
}


chatSend.addEventListener(
    "click",
    sendChat
);


chatInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            sendChat();
        }

    }
);


/* ============================================================
 * Playback state
 * ============================================================
 */

function getLocalPosition() {

    return Number.isFinite(video.currentTime)
        ? video.currentTime
        : 0;
}


function getLocalPaused() {

    return video.paused;
}


function sendPlaybackState(doSeek = false) {

    if (!state.logged)
        return;

    const stateMessage = {

        playstate: {

            position:
                getLocalPosition(),

            paused:
                getLocalPaused()

        },

        ping: {

            clientRtt:
                0,

            clientLatencyCalculation:
                Date.now() / 1000
        }

    };


    if (doSeek) {

        stateMessage.playstate.doSeek =
            true;

        state.clientIgnore++;
    }


    if (state.clientIgnore) {

        stateMessage.ignoringOnTheFly = {

            client:
                state.clientIgnore
        };
    }


    if (state.serverIgnore) {

        stateMessage.ignoringOnTheFly = {

            ...(stateMessage.ignoringOnTheFly || {}),

            server:
                state.serverIgnore
        };

        state.serverIgnore = 0;
    }


    send({
        State:
            stateMessage
    });
}


/* ============================================================
 * Local video events
 * ============================================================
 */

video.addEventListener(
    "play",
    () => {

        if (state.ignoreLocalEvents)
            return;

        sendPlaybackState(false);

    }
);


video.addEventListener(
    "pause",
    () => {

        if (state.ignoreLocalEvents)
            return;

        sendPlaybackState(false);

    }
);


let seekTimer = null;

video.addEventListener(
    "seeking",
    () => {

        if (state.ignoreLocalEvents)
            return;

        /*
         * seeking 可能连续触发很多次。
         */
        clearTimeout(seekTimer);

        seekTimer = setTimeout(
            () => {

                sendPlaybackState(true);

            },
            80
        );

    }
);


/* ============================================================
 * 收到服务器 State
 * ============================================================
 */

function handleState(message) {

    /*
     * Syncplay server 的 ping。
     */
    if (message.ping) {

        if (
            message.ping.latencyCalculation
        ) {

            state.lastServerLatencyCalculation =
                message.ping.latencyCalculation;
        }

        /*
         * 如果服务器返回了 clientLatencyCalculation，
         * 可以计算近似 RTT。
         */
        if (
            message.ping.clientLatencyCalculation
        ) {

            const now =
                Date.now() / 1000;

            const rtt =
                now -
                message.ping.clientLatencyCalculation;

            if (rtt >= 0 && rtt < 10) {

                statusElement.textContent =
                    `已连接 · RTT ${(rtt * 1000).toFixed(0)} ms`;
            }
        }
    }


    /*
     * Syncplay 的 ignoringOnTheFly
     */
    if (message.ignoringOnTheFly) {

        const ignore =
            message.ignoringOnTheFly;

        if (ignore.server !== undefined) {

            state.serverIgnore =
                ignore.server;
        }

        if (ignore.client !== undefined) {

            if (
                ignore.client ===
                state.clientIgnore
            ) {

                state.clientIgnore = 0;
            }
        }
    }


    if (!message.playstate)
        return;


    const playstate =
        message.playstate;

    const position =
        Number(playstate.position) || 0;

    const paused =
        !!playstate.paused;

    const doSeek =
        !!playstate.doSeek;


    /*
     * 自己发出的 State 经过服务器广播回来，
     * 不要再次触发 play/pause -> 无限回声。
     */
    if (
        playstate.setBy &&
        playstate.setBy === state.username
    ) {

        return;
    }


    /*
     * 房间里的其他人控制播放。
     */
    applyRemoteState(
        position,
        paused,
        doSeek
    );
}


/* ============================================================
 * 应用远端播放状态
 * ============================================================
 */

function applyRemoteState(
    position,
    paused,
    doSeek
) {

    if (!Number.isFinite(position))
        return;


    const current =
        getLocalPosition();

    const difference =
        position - current;


    /*
     * 如果差距非常小，就不 seek。
     *
     * HTML5 video 的 currentTime 本身存在
     * 一定程度的误差。
     */
    if (
        doSeek ||
        Math.abs(difference) > 0.35
    ) {

        state.ignoreLocalEvents = true;

        try {

            video.currentTime =
                Math.max(0, position);

        } finally {

            /*
             * currentTime 设置可能同步触发，
             * 但 play/pause 是异步的，
             * 给一点时间防止回声。
             */
            setTimeout(
                () => {
                    state.ignoreLocalEvents = false;
                },
                100
            );
        }
    }


    if (paused) {

        if (!video.paused) {

            state.ignoreLocalEvents = true;

            video.pause();

            setTimeout(
                () => {
                    state.ignoreLocalEvents = false;
                },
                100
            );
        }

    } else {

        if (video.paused) {

            state.ignoreLocalEvents = true;

            /*
             * 浏览器 autoplay policy 可能阻止这里播放。
             */
            video.play().catch(
                () => {

                    addChatMessage(
                        "System",
                        "浏览器阻止了自动播放，请手动点击播放。"
                    );

                }
            );

            setTimeout(
                () => {
                    state.ignoreLocalEvents = false;
                },
                100
            );
        }
    }
}


/* ============================================================
 * Ping
 *
 * Syncplay 服务器要求客户端持续发送 State ping。
 * 官方协议说明中明确提到，即使暂停也需要 ping。
 * ============================================================
 */

function startPing() {

    stopPing();

    state.pingTimer =
        setInterval(
            () => {

                if (!state.logged)
                    return;

                sendPlaybackState(false);

            },
            1000
        );
}


function stopPing() {

    if (state.pingTimer) {

        clearInterval(
            state.pingTimer
        );

        state.pingTimer = null;
    }
}


/* ============================================================
 * Buttons
 * ============================================================
 */

connectBtn.addEventListener(
    "click",
    connect
);

disconnectBtn.addEventListener(
    "click",
    disconnect
);


/* ============================================================
 * Enter 快捷键
 * ============================================================
 */

[
    serverInput,
    roomInput,
    passwordInput,
    usernameInput
].forEach(input => {

    input.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !state.connected
            ) {

                connect();

            }

        }
    );

});


/* ============================================================
 * 初始状态
 * ============================================================
 */

setStatus(
    "输入房间后连接"
);

</script>

</body>
</html>
